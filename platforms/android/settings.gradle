pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // N16: rustls-platform-verifier's Java side (net/src/android.rs), published only on its GitHub maven branch
        maven {
            url = 'https://github.com/rustls/rustls-platform-verifier/raw/maven-archive/android-release-support/maven/'
            content { includeGroup 'org.rustls' }
        }
    }
}

rootProject.name = "partyboard-android"
include ':app'
