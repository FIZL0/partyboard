[package]
name = "pbnet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Party Board online play: transport, lobby, lockstep (C ABI in include/port/pbnet.h)"

[lib]
# staticlib: linked into `dol` by CMake. rlib: lets `cargo test` build the crate's own tests.
crate-type = ["staticlib", "rlib"]

[features]
# The iroh transport (`transport.rs`, `codes.rs`) on tokio's threads: every build but the browser's. Without it
# (N92, `--no-default-features`, the wasm32-unknown-emscripten build) the transport is WebRTC in the page (`rtc.rs`)
# on a current-thread runtime the game pumps.
default = ["iroh"]
iroh = ["dep:iroh", "dep:iroh-tickets", "dep:iroh-mainline-address-lookup", "dep:iroh-mdns-address-lookup",
        "dep:n0-mainline", "dep:n0-future", "dep:reqwest", "dep:rustls", "tokio/rt-multi-thread", "dep:str0m", "dep:netdev",
        "dep:data-encoding", "dep:socket2", "tokio/net"]
# N119: iOS's LAN backend (`bonjour.rs`, dns_sd) on another OS, against Avahi's libdns_sd: tests standing in for an
# iPhone (`cargo test --features bonjour -- --ignored bonjour`). iOS builds it without the feature.
bonjour = ["iroh", "dep:libc"]

[dependencies]
# Transport (`transport.rs`, `codes.rs`), as opentennis's `hst-base/src/net.rs`: iroh QUIC with tickets for codes,
# addresses on the mainline DHT and the LAN by mDNS, short codes on the DHT and a pkarr relay (reqwest over iroh's
# rustls/ring), tasks on tokio.
iroh = { version = "1.3", optional = true }
iroh-tickets = { version = "1", optional = true }
iroh-mainline-address-lookup = { version = "0.6", optional = true }
iroh-mdns-address-lookup = { version = "0.6", optional = true }
n0-mainline = { version = "0.7", optional = true }
n0-future = { version = "0.3", optional = true }
tokio = { version = "1", features = ["rt", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring"], optional = true }
# N96: the browser's WebRTC (`rtc.rs`) on the desktop too, so a desktop lobby can host or join browsers: str0m, a
# sans-IO stack driven on our own UDP sockets (`rtc/native.rs`, as opentennis's hst-base `net/rtc/native.rs`), its
# crypto pure Rust so it builds for every native target; netdev (iroh's netwatch already builds it) for the host
# candidates.
str0m = { version = "0.24", default-features = false, features = ["rust-crypto"], optional = true }
netdev = { version = "0.46", optional = true }
# N119: LAN DNS-SD (`lan.rs`, `dnssd.rs`): iroh's mDNS instance labels, and the multicast socket's options. The
# versions iroh already builds.
data-encoding = { version = "2", optional = true }
socket2 = { version = "0.6", optional = true }
libc = { version = "0.2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# N16: the short codes' HTTPS on Android (`android.rs`, as opentennis's hst-base android.rs init_tls / tls): the phone's
# own certificate check, whose Java side the APK bundles (platforms/android/app/build.gradle), and Mozilla's roots
# should its JNI init fail. The versions reqwest and iroh already build.
[target.'cfg(target_os = "android")'.dependencies]
rustls-platform-verifier = "0.7"
jni22 = { package = "jni", version = "0.22", default-features = false }
webpki-roots = "1"
# N36: iroh's interface scan (netdev) needs the VM and activity from here; see android.rs `init_ndk_context`.
ndk-context = "0.1"

# N12: iOS. iroh -> netwatch -> netdev 0.46's darwin code uses `libc::in6_ifreq`, which libc 0.2.190 and later define
# for macOS only, so the crate stops compiling for aarch64-apple-ios (research/journal/2026-10-27-n12-mobile).
# 0.2.189 has it for every Apple target (opentennis ships iOS on it). One libc builds for the whole graph, so this
# pins it everywhere; lift it once netdev or libc fix the cfg.
[target.'cfg(target_os = "ios")'.dependencies]
libc = "=0.2.189"

[profile.release]
# Never unwind across the C ABI.
panic = "abort"
debug = 1
