[package]
name = "pbnet"
version = "0.1.0"
edition = "2021"
publish = false
description = "Party Board online play: transport, lobby, lockstep (C ABI in include/port/pbnet.h)"

[lib]
# staticlib: linked into `dol` by CMake. rlib: lets `cargo test` build the crate's own tests.
crate-type = ["staticlib", "rlib"]

[dependencies]
# Transport (`transport.rs`, `codes.rs`), as opentennis's `hst-base/src/net.rs`: iroh QUIC with tickets for codes,
# addresses on the mainline DHT and the LAN by mDNS, short codes on the DHT and a pkarr relay (reqwest over iroh's
# rustls/ring), tasks on tokio.
iroh = "1.3"
iroh-tickets = "1"
iroh-mainline-address-lookup = "0.6"
iroh-mdns-address-lookup = "0.6"
n0-mainline = "0.7"
n0-future = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Never unwind across the C ABI.
panic = "abort"
debug = 1
