# Unattended runs: `tmux new -s pb agent-runner run 3`, see https://github.com/FIZL0/agent-runner
[plan]
dir = "plan"
journal = "research/journal"

[run]
test = "tools/check.sh"
slots = 3
rules = "AGENTS.md"
notes = ".runner"
links = ["orig"]
slot_env = ["AGENT_SLOT={n}", "SDL_APP_ID=partyboard-test", "PB_DISC=/home/ryha/repos/partyboard/orig/GMPE01_01/GMPE01_01.ciso"]
joinable = ["plan/*.md", "research/journal/*"]
untested = ["*.md", "research/*"]
