# Unattended runs: `systemd-run --user --scope --slice=runner.slice tmux -L pb new -s pb agent-runner run 3` (runner.slice:
# CPUWeight=1 IOWeight=1 in ~/.config/systemd/user, so slots yield to the desktop), see https://github.com/FIZL0/agent-runner
[plan]
dir = "plan"
journal = "research/journal"

[run]
test = "tools/check.sh"
slots = 3
rules = "AGENTS.md"
notes = ".runner"
links = ["orig"]
slot_env = ["AGENT_SLOT={n}", "CMAKE_BUILD_PARALLEL_LEVEL=6", "CARGO_BUILD_JOBS=6", "SDL_APP_ID=partyboard-test", "PB_DISC=/home/ryha/repos/partyboard/orig/GMPE01_01/GMPE01_01.ciso"]
joinable = ["plan/*.md", "research/journal/*"]
untested = ["*.md", "research/*"]
